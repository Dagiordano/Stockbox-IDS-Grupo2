{% extends 'base.html' %}
{% load static %}

{% block title %}Cerrar Sesión - StockBox{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Tarjeta del logout -->
        <div class="bg-white rounded-2xl shadow-xl p-8 text-center border-2 border-transparent hover:border-orange-200 transition-all duration-300">
            <!-- Logo -->
            <div class="mb-8">
                <div class="inline-block p-4 bg-gradient-to-r from-orange-500 to-orange-600 rounded-2xl mb-4 shadow-lg">
                    <i class="fas fa-box text-white text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">StockBox</h1>
            </div>

            <!-- Icon -->
            <div class="mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-orange-100 rounded-full">
                    <i class="fas fa-sign-out-alt text-orange-600 text-3xl"></i>
                </div>
            </div>

            <!-- Message -->
            <h2 class="text-2xl font-bold text-gray-800 mb-4">¿Cerrar Sesión?</h2>
            <p class="text-gray-600 mb-8">¿Estás seguro de que deseas cerrar tu sesión?</p>

            <!-- Logout Form -->
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-red-700 transform hover:-translate-y-1 hover:shadow-lg transition-all duration-200 mb-4 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    Sí, Cerrar Sesión
                </button>
            </form>

            <!-- Cancel Link -->
            <a href="{% url 'dashboard' %}" class="block w-full bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 transform hover:-translate-y-1 transition-all duration-200 flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i>
                Cancelar
            </a>
        </div>
    </div>
</div>
{% endblock %}
